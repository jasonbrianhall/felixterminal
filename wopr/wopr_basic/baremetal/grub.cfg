set timeout=0
set default=0
if [ "$grub_platform" = "efi" ]; then
    # UEFI: no VBE, and the firmware's graphics (GOP) usually offers just
    # the screen's own mode, which GRUB is already in: hand that over.
    insmod all_video
    set gfxpayload=keep
else
    set gfxpayload=@GFXMODE@
fi

menuentry "Felix BASIC" {
    # Options: audio=speaker|hda|hdmi|analog|ac97|sb|off, hda=BB:DD.F, floppy=off|trace, latency=MS, pause (see README)
    multiboot /boot/felixbasic.elf
    # The CD's sample programs, as a disk image for the RAM disk
    if [ -f /boot/felixbasic.img ]; then
        module /boot/felixbasic.img
    fi
    boot
}
